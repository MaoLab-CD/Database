server {
    listen 80;
    server_name _;

    # 允许上传较大的 Excel 文件
    client_max_body_size 100m;

    # 前端静态资源（React history 路由刷新兜底）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location = /api/documents/upload {
        # 合并扫描版知情同意书和类器官报告允许更大的 PDF；其他接口仍保持 100 MB。
        # 为 multipart 表单边界预留少量开销；后端仍严格限制 PDF 本体不超过 200 MB。
        client_max_body_size 205m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/api/documents/[0-9]+/(preview|download)$ {
        # 大 PDF 直接转发给客户端，避免 Nginx 将完整响应写入 proxy_temp。
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 扫盘、导入等长任务，放宽超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend:8000;
    }
}
